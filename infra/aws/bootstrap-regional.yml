AWSTemplateFormatVersion: "2010-09-09"
Description: fly.ae V0 regional bootstrap resources

Parameters:
  ArtifactBucketName:
    Type: String
    Default: fly-ae-sam-artifacts-808906610083-eu-central-1
  EnvironmentName:
    Type: String
    Default: v0-prod
  SecretPathPrefix:
    Type: String
    Default: fly-ae/v0-prod
  SecretDescriptionPrefix:
    Type: String
    Default: fly.ae V0 production

Resources:
  SamArtifactsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref ArtifactBucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldArtifactVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
      Tags:
        - Key: Application
          Value: fly.ae
        - Key: Environment
          Value: !Ref EnvironmentName

  SessionSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub ${SecretPathPrefix}/session-secret
      Description: !Sub ${SecretDescriptionPrefix} session signing secret
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true
      Tags:
        - Key: Application
          Value: fly.ae
        - Key: Environment
          Value: !Ref EnvironmentName

  OtpPepper:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub ${SecretPathPrefix}/otp-pepper
      Description: !Sub ${SecretDescriptionPrefix} OTP pepper
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true
      Tags:
        - Key: Application
          Value: fly.ae
        - Key: Environment
          Value: !Ref EnvironmentName

  ShareEncryptionSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub ${SecretPathPrefix}/share-encryption-secret
      Description: !Sub ${SecretDescriptionPrefix} share encryption secret
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true
      Tags:
        - Key: Application
          Value: fly.ae
        - Key: Environment
          Value: !Ref EnvironmentName

Outputs:
  ArtifactBucketName:
    Value: !Ref SamArtifactsBucket
  SessionSecretId:
    Value: !Ref SessionSecret
  OtpPepperId:
    Value: !Ref OtpPepper
  ShareEncryptionSecretId:
    Value: !Ref ShareEncryptionSecret
