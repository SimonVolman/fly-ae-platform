AWSTemplateFormatVersion: "2010-09-09"
Description: fly.ae V0 regional bootstrap resources

Parameters:
  ArtifactBucketName:
    Type: String
    Default: fly-ae-sam-artifacts-808906610083-eu-central-1

Resources:
  SamArtifactsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref ArtifactBucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldArtifactVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
      Tags:
        - Key: Application
          Value: fly.ae
        - Key: Environment
          Value: v0-prod

  SessionSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: fly-ae/v0-prod/session-secret
      Description: fly.ae V0 production session signing secret
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true
      Tags:
        - Key: Application
          Value: fly.ae
        - Key: Environment
          Value: v0-prod

  OtpPepper:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: fly-ae/v0-prod/otp-pepper
      Description: fly.ae V0 production OTP pepper
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true
      Tags:
        - Key: Application
          Value: fly.ae
        - Key: Environment
          Value: v0-prod

  ShareEncryptionSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: fly-ae/v0-prod/share-encryption-secret
      Description: fly.ae V0 production share encryption secret
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true
      Tags:
        - Key: Application
          Value: fly.ae
        - Key: Environment
          Value: v0-prod

Outputs:
  ArtifactBucketName:
    Value: !Ref SamArtifactsBucket
  SessionSecretId:
    Value: !Ref SessionSecret
  OtpPepperId:
    Value: !Ref OtpPepper
  ShareEncryptionSecretId:
    Value: !Ref ShareEncryptionSecret
