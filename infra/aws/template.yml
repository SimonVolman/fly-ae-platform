AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: fly.ae V0 production serverless application

Parameters:
  ResourcePrefix:
    Type: String
    Default: fly-ae-v0-prod
    AllowedPattern: "[a-z0-9-]+"
  EnvironmentName:
    Type: String
    Default: v0-prod
  EnableCustomDomain:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
  FrontendDomainName:
    Type: String
    Default: dev.fly.ae
  HostedZoneId:
    Type: String
  FrontendCertificateArn:
    Type: String
  SessionSecretParameter:
    Type: String
    Default: fly-ae/v0-prod/session-secret
  OtpPepperParameter:
    Type: String
    Default: fly-ae/v0-prod/otp-pepper
  ShareEncryptionSecretParameter:
    Type: String
    Default: fly-ae/v0-prod/share-encryption-secret
  EnableTelegramOtp:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
  TelegramBotUsername:
    Type: String
    Default: FlyAeOtpBot
    AllowedPattern: "[A-Za-z0-9_]{5,32}"
  TelegramBotTokenParameter:
    Type: String
    Default: fly-ae/v0-prod/telegram-bot-token
  TelegramWebhookSecretParameter:
    Type: String
    Default: fly-ae/v0-prod/telegram-webhook-secret
  TelegramUploadNotificationChatId:
    Type: Number
    Default: 0
    MinValue: 0
  DeploymentRevision:
    Type: String
    Default: local

Conditions:
  CustomDomainEnabled: !Equals [!Ref EnableCustomDomain, "true"]
  TelegramOtpEnabled: !Equals [!Ref EnableTelegramOtp, "true"]

Globals:
  Function:
    Runtime: java21
    Architectures:
      - arm64
    MemorySize: 1024
    Timeout: 30
    Tracing: PassThrough
    Tags:
      Application: fly.ae
      Environment: !Ref EnvironmentName

Resources:
  FlyAeTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref ResourcePrefix
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttlEpochSeconds
        Enabled: true
      Tags:
        - Key: Application
          Value: fly.ae
        - Key: Environment
          Value: !Ref EnvironmentName

  DocumentsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub ${ResourcePrefix}-documents-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - GET
              - PUT
              - POST
            AllowedOrigins:
              - !Sub https://${FrontendDomainName}
            ExposedHeaders:
              - ETag
              - x-amz-request-id
            MaxAge: 3600
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      Tags:
        - Key: Application
          Value: fly.ae
        - Key: Environment
          Value: !Ref EnvironmentName

  FrontendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub ${ResourcePrefix}-frontend-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Application
          Value: fly.ae
        - Key: Environment
          Value: !Ref EnvironmentName

  BackendExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ResourcePrefix}-backend
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub ${ResourcePrefix}-backend
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ResourcePrefix}-backend:*
              - Sid: DynamoPersistence
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:TransactWriteItems
                  - dynamodb:UpdateItem
                Resource:
                  - !GetAtt FlyAeTable.Arn
                  - !Sub ${FlyAeTable.Arn}/index/*
              - Sid: DocumentsBucket
                Effect: Allow
                Action:
                  - s3:AbortMultipartUpload
                  - s3:DeleteObject
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub ${DocumentsBucket.Arn}/*
              - Sid: SendOtpEmail
                Effect: Allow
                Action: ses:SendEmail
                Resource: "*"
                Condition:
                  StringEquals:
                    ses:FromAddress: !Sub no-reply@${FrontendDomainName}

  BackendFunction:
    Type: AWS::Serverless::Function
    DependsOn: BackendLogGroup
    Properties:
      FunctionName: !Sub ${ResourcePrefix}-backend
      Handler: ae.fly.backend.lambda.StreamLambdaHandler::handleRequest
      CodeUri: ../../apps/backend/build/distributions/fly-ae-backend-lambda.zip
      Role: !GetAtt BackendExecutionRole.Arn
      Environment:
        Variables:
          SPRING_PROFILES_ACTIVE: v0-prod
          SERVER_FORWARD_HEADERS_STRATEGY: none
          FLY_PERSISTENCE: dynamodb
          FLY_DYNAMODB_REGION: !Ref AWS::Region
          FLY_DYNAMODB_TABLE: !Ref FlyAeTable
          FLY_DYNAMODB_CREATE_TABLE: "false"
          FLY_S3_REGION: !Ref AWS::Region
          FLY_S3_BUCKET: !Ref DocumentsBucket
          FLY_S3_PATH_STYLE: "false"
          FLY_PUBLIC_BASE_URL: !Sub https://${FrontendDomainName}
          FLY_ALLOWED_ORIGINS: !Sub https://${FrontendDomainName}
          FLY_EMAIL_FROM: !Sub no-reply@${FrontendDomainName}
          FLY_EMAIL_REGION: !Ref AWS::Region
          FLY_TELEGRAM_ENABLED: !Ref EnableTelegramOtp
          FLY_TELEGRAM_BOT_USERNAME: !Ref TelegramBotUsername
          FLY_TELEGRAM_BOT_TOKEN: !If
            - TelegramOtpEnabled
            - !Sub "{{resolve:secretsmanager:${TelegramBotTokenParameter}:SecretString}}"
            - ""
          FLY_TELEGRAM_WEBHOOK_SECRET: !If
            - TelegramOtpEnabled
            - !Sub "{{resolve:secretsmanager:${TelegramWebhookSecretParameter}:SecretString}}"
            - ""
          FLY_TELEGRAM_UPLOAD_NOTIFICATION_CHAT_ID: !Ref TelegramUploadNotificationChatId
          FLY_DEPLOYMENT_REVISION: !Ref DeploymentRevision
          FLY_SESSION_SECRET: !Sub "{{resolve:secretsmanager:${SessionSecretParameter}:SecretString}}"
          FLY_OTP_PEPPER: !Sub "{{resolve:secretsmanager:${OtpPepperParameter}:SecretString}}"
          FLY_SHARE_ENCRYPTION_SECRET: !Sub "{{resolve:secretsmanager:${ShareEncryptionSecretParameter}:SecretString}}"

  BackendLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${ResourcePrefix}-backend
      RetentionInDays: 14
      Tags:
        - Key: Application
          Value: fly.ae
        - Key: Environment
          Value: !Ref EnvironmentName

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Ref ResourcePrefix
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - !Sub https://${FrontendDomainName}
        AllowMethods:
          - GET
          - POST
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Authorization
          - Content-Type
        ExposeHeaders:
          - Retry-After
        MaxAge: 3600
      Tags:
        Application: fly.ae
        Environment: !Ref EnvironmentName

  HttpApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt BackendFunction.Arn
      PayloadFormatVersion: "2.0"
      TimeoutInMillis: 30000

  HttpApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: ANY /{proxy+}
      Target: !Sub integrations/${HttpApiIntegration}

  HttpApiLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/apigateway/${ResourcePrefix}
      RetentionInDays: 14

  HttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50
      AccessLogSettings:
        DestinationArn: !GetAtt HttpApiLogGroup.Arn
        Format: >-
          {"requestId":"$context.requestId","ip":"$context.identity.sourceIp","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","routeKey":"$context.routeKey","status":"$context.status","protocol":"$context.protocol","responseLength":"$context.responseLength","integrationError":"$context.integrationErrorMessage"}
      Tags:
        Application: fly.ae
        Environment: !Ref EnvironmentName

  BackendInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref BackendFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*

  SesIdentity:
    Type: AWS::SES::EmailIdentity
    Condition: CustomDomainEnabled
    Properties:
      EmailIdentity: !Ref FrontendDomainName
      DkimAttributes:
        SigningEnabled: true
      FeedbackAttributes:
        EmailForwardingEnabled: true
      Tags:
        - Key: Application
          Value: fly.ae
        - Key: Environment
          Value: !Ref EnvironmentName

  SesDkimRecord1:
    Type: AWS::Route53::RecordSet
    Condition: CustomDomainEnabled
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !GetAtt SesIdentity.DkimDNSTokenName1
      Type: CNAME
      TTL: 300
      ResourceRecords:
        - !GetAtt SesIdentity.DkimDNSTokenValue1

  SesDkimRecord2:
    Type: AWS::Route53::RecordSet
    Condition: CustomDomainEnabled
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !GetAtt SesIdentity.DkimDNSTokenName2
      Type: CNAME
      TTL: 300
      ResourceRecords:
        - !GetAtt SesIdentity.DkimDNSTokenValue2

  SesDkimRecord3:
    Type: AWS::Route53::RecordSet
    Condition: CustomDomainEnabled
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !GetAtt SesIdentity.DkimDNSTokenName3
      Type: CNAME
      TTL: 300
      ResourceRecords:
        - !GetAtt SesIdentity.DkimDNSTokenValue3

  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${ResourcePrefix}-frontend
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub ${ResourcePrefix}-static-routes
      AutoPublish: true
      FunctionConfig:
        Comment: Resolve clean URLs and dynamic share tokens to static files
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri.indexOf('/share/') === 0 && uri.indexOf('.') === -1) {
            request.uri = '/share/__token__/index.html';
          } else if (uri === '/') {
            request.uri = '/index.html';
          } else if (uri.endsWith('/')) {
            request.uri = uri + 'index.html';
          } else if (uri.indexOf('.') === -1) {
            request.uri = uri + '/index.html';
          }
          return request;
        }

  FrontendResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub ${ResourcePrefix}-security-headers
        SecurityHeadersConfig:
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true
          XSSProtection:
            ModeBlock: true
            Protection: true
            Override: true

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Aliases: !If
          - CustomDomainEnabled
          - - !Ref FrontendDomainName
          - !Ref AWS::NoValue
        Comment: fly.ae V0 production frontend
        DefaultCacheBehavior:
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          Compress: true
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt FrontendRewriteFunction.FunctionARN
          ResponseHeadersPolicyId: !Ref FrontendResponseHeadersPolicy
          TargetOriginId: FrontendS3
          ViewerProtocolPolicy: redirect-to-https
        DefaultRootObject: index.html
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        Origins:
          - DomainName: !GetAtt FrontendBucket.RegionalDomainName
            Id: FrontendS3
            OriginAccessControlId: !Ref FrontendOriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ""
        PriceClass: PriceClass_100
        ViewerCertificate: !If
          - CustomDomainEnabled
          - AcmCertificateArn: !Ref FrontendCertificateArn
            MinimumProtocolVersion: TLSv1.2_2021
            SslSupportMethod: sni-only
          - CloudFrontDefaultCertificate: true
      Tags:
        - Key: Application
          Value: fly.ae
        - Key: Environment
          Value: !Ref EnvironmentName

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${FrontendBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}

  FrontendAliasRecord:
    Type: AWS::Route53::RecordSet
    Condition: CustomDomainEnabled
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref FrontendDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt FrontendDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  FrontendAliasIpv6Record:
    Type: AWS::Route53::RecordSet
    Condition: CustomDomainEnabled
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref FrontendDomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt FrontendDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  LambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ResourcePrefix}-lambda-errors
      AlarmDescription: fly.ae backend Lambda errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref BackendFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  LambdaThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ResourcePrefix}-lambda-throttles
      AlarmDescription: fly.ae backend Lambda throttles
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref BackendFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  ApiServerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ResourcePrefix}-api-5xx
      AlarmDescription: fly.ae API Gateway 5xx responses
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref HttpApi
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  ApiBaseUrl:
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  FrontendUrl:
    Value: !Sub https://${FrontendDomainName}
  FrontendBucketName:
    Value: !Ref FrontendBucket
  DocumentsBucketName:
    Value: !Ref DocumentsBucket
  DistributionId:
    Value: !Ref FrontendDistribution
  DistributionDomainName:
    Value: !GetAtt FrontendDistribution.DomainName
  DynamoTableName:
    Value: !Ref FlyAeTable
