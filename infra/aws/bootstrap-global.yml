AWSTemplateFormatVersion: "2010-09-09"
Description: fly.ae global bootstrap resources for DEV and PROD deployment

Parameters:
  FrontendDomainName:
    Type: String
    Default: fly.ae
  HostedZoneId:
    Type: String
  CreateDevCertificate:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
  DevFrontendDomainName:
    Type: String
    Default: dev.fly.ae
  DevHostedZoneId:
    Type: String
    Default: ""
  CreateBudget:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
  BudgetEmail:
    Type: String
  GitHubOidcProviderArn:
    Type: String
  GitHubOidcSubject:
    Type: String
    Default: repo:SimonVolman@3509507/fly-ae-platform@1319572123:environment:dev
  ApplicationRegion:
    Type: String
    Default: eu-central-1
  ApplicationStackName:
    Type: String
    Default: fly-ae-v0-prod
  ResourcePrefix:
    Type: String
    Default: fly-ae-v0-prod
    AllowedPattern: "[a-z0-9-]+"
  EnvironmentName:
    Type: String
    Default: dev
  SecretPathPrefix:
    Type: String
    Default: fly-ae/v0-prod
  ArtifactBucketName:
    Type: String
    Default: fly-ae-sam-artifacts-808906610083-eu-central-1
  FrontendBucketName:
    Type: String
    Default: fly-ae-v0-prod-frontend-808906610083

Conditions:
  ShouldCreateDevCertificate: !Equals [!Ref CreateDevCertificate, "true"]
  ShouldCreateBudget: !Equals [!Ref CreateBudget, "true"]

Resources:
  FrontendCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref FrontendDomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref FrontendDomainName
          HostedZoneId: !Ref HostedZoneId
      Tags:
        - Key: Application
          Value: fly.ae
        - Key: Environment
          Value: !Ref EnvironmentName

  # The logical ID is retained to update the existing secondary certificate in place.
  LegacyFrontendCertificate:
    Type: AWS::CertificateManager::Certificate
    Condition: ShouldCreateDevCertificate
    UpdateReplacePolicy: Retain
    Properties:
      DomainName: !Ref DevFrontendDomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DevFrontendDomainName
          HostedZoneId: !Ref DevHostedZoneId
      Tags:
        - Key: Application
          Value: fly.ae
        - Key: Environment
          Value: !Ref EnvironmentName

  CloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ResourcePrefix}-cloudformation
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub ${ResourcePrefix}-resources
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ApplicationServices
                Effect: Allow
                Action:
                  - apigateway:*
                  - cloudwatch:DeleteAlarms
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:PutMetricAlarm
                  - cloudfront:*
                  - dynamodb:*
                  - lambda:*
                  - logs:*
                  - route53:ChangeResourceRecordSets
                  - route53:GetChange
                  - route53:GetHostedZone
                  - route53:ListResourceRecordSets
                  - s3:*
                  - ses:*
                Resource: "*"
              - Sid: ApplicationRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:PassRole
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateAssumeRolePolicy
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ResourcePrefix}-*
              - Sid: ExpandServerlessTransform
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${ApplicationRegion}:aws:transform/Serverless-2016-10-31
              - Sid: ReadApplicationSecrets
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub arn:${AWS::Partition}:secretsmanager:${ApplicationRegion}:${AWS::AccountId}:secret:${SecretPathPrefix}/*

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ResourcePrefix}-github-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Ref GitHubOidcSubject
      Policies:
        - PolicyName: !Sub ${ResourcePrefix}-deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DeployApplicationStack
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:CreateStack
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStackResources
                  - cloudformation:DescribeStacks
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListStackResources
                  - cloudformation:UpdateStack
                Resource:
                  - !Sub arn:${AWS::Partition}:cloudformation:${ApplicationRegion}:${AWS::AccountId}:stack/${ApplicationStackName}/*
                  - arn:aws:cloudformation:eu-central-1:aws:transform/Serverless-2016-10-31
              - Sid: ReadBootstrapStack
                Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Ref AWS::StackId
              - Sid: ValidateTemplates
                Effect: Allow
                Action:
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListStacks
                  - cloudformation:ValidateTemplate
                Resource: "*"
              - Sid: PassCloudFormationRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com
              - Sid: SamArtifactsBucket
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource: !Sub arn:${AWS::Partition}:s3:::${ArtifactBucketName}
              - Sid: SamArtifactsObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${ArtifactBucketName}/*
              - Sid: PublishFrontendBucket
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource: !Sub arn:${AWS::Partition}:s3:::${FrontendBucketName}
              - Sid: PublishFrontendObjects
                Effect: Allow
                Action:
                  - s3:DeleteObject
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${FrontendBucketName}/*
              - Sid: InvalidateFrontendCache
                Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/*

  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Condition: ShouldCreateBudget
    Properties:
      Budget:
        BudgetName: !Sub ${ResourcePrefix}-monthly
        BudgetLimit:
          Amount: 25
          Unit: USD
        BudgetType: COST
        TimeUnit: MONTHLY
      NotificationsWithSubscribers:
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: ACTUAL
            Threshold: 10
            ThresholdType: ABSOLUTE_VALUE
          Subscribers:
            - Address: !Ref BudgetEmail
              SubscriptionType: EMAIL
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: ACTUAL
            Threshold: 25
            ThresholdType: ABSOLUTE_VALUE
          Subscribers:
            - Address: !Ref BudgetEmail
              SubscriptionType: EMAIL

Outputs:
  FrontendCertificateArn:
    Value: !Ref FrontendCertificate
  DevFrontendCertificateArn:
    Condition: ShouldCreateDevCertificate
    Value: !Ref LegacyFrontendCertificate
  GitHubDeployRoleArn:
    Value: !GetAtt GitHubDeployRole.Arn
  CloudFormationExecutionRoleArn:
    Value: !GetAtt CloudFormationExecutionRole.Arn
