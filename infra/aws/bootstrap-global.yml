AWSTemplateFormatVersion: "2010-09-09"
Description: fly.ae V0 global bootstrap resources for GitHub deployment

Parameters:
  FrontendDomainName:
    Type: String
    Default: fly.turbulencesimtrading.com
  HostedZoneId:
    Type: String
  BudgetEmail:
    Type: String
  GitHubOidcProviderArn:
    Type: String
  GitHubOidcSubject:
    Type: String
    Default: repo:SimonVolman@3509507/fly-ae-platform@1319572123:environment:v0-prod
  ApplicationRegion:
    Type: String
    Default: eu-central-1
  ApplicationStackName:
    Type: String
    Default: fly-ae-v0-prod
  ArtifactBucketName:
    Type: String
    Default: fly-ae-sam-artifacts-808906610083-eu-central-1
  FrontendBucketName:
    Type: String
    Default: fly-ae-v0-prod-frontend-808906610083

Resources:
  FrontendCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref FrontendDomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref FrontendDomainName
          HostedZoneId: !Ref HostedZoneId
      Tags:
        - Key: Application
          Value: fly.ae
        - Key: Environment
          Value: v0-prod

  CloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: fly-ae-v0-prod-cloudformation
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: fly-ae-v0-prod-resources
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ApplicationServices
                Effect: Allow
                Action:
                  - apigateway:*
                  - cloudwatch:DeleteAlarms
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:PutMetricAlarm
                  - cloudfront:*
                  - dynamodb:*
                  - lambda:*
                  - logs:*
                  - route53:ChangeResourceRecordSets
                  - route53:GetChange
                  - route53:GetHostedZone
                  - s3:*
                  - ses:*
                Resource: "*"
              - Sid: ApplicationRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:PassRole
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateAssumeRolePolicy
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/fly-ae-v0-prod-*
              - Sid: ExpandServerlessTransform
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${ApplicationRegion}:aws:transform/Serverless-2016-10-31
              - Sid: ReadApplicationSecrets
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource: !Sub arn:${AWS::Partition}:ssm:${ApplicationRegion}:${AWS::AccountId}:parameter/fly-ae/v0-prod/*
              - Sid: DecryptApplicationSecrets
                Effect: Allow
                Action: kms:Decrypt
                Resource: "*"
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub ssm.${ApplicationRegion}.amazonaws.com

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: fly-ae-v0-prod-github-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Ref GitHubOidcSubject
      Policies:
        - PolicyName: fly-ae-v0-prod-deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DeployApplicationStack
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:CreateStack
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStackResources
                  - cloudformation:DescribeStacks
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListStackResources
                  - cloudformation:UpdateStack
                Resource:
                  - !Sub arn:${AWS::Partition}:cloudformation:${ApplicationRegion}:${AWS::AccountId}:stack/${ApplicationStackName}/*
                  - arn:aws:cloudformation:eu-central-1:aws:transform/Serverless-2016-10-31
              - Sid: ReadBootstrapStack
                Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Ref AWS::StackId
              - Sid: ValidateTemplates
                Effect: Allow
                Action:
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListStacks
                  - cloudformation:ValidateTemplate
                Resource: "*"
              - Sid: PassCloudFormationRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com
              - Sid: SamArtifactsBucket
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource: !Sub arn:${AWS::Partition}:s3:::${ArtifactBucketName}
              - Sid: SamArtifactsObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${ArtifactBucketName}/*
              - Sid: PublishFrontendBucket
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource: !Sub arn:${AWS::Partition}:s3:::${FrontendBucketName}
              - Sid: PublishFrontendObjects
                Effect: Allow
                Action:
                  - s3:DeleteObject
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${FrontendBucketName}/*
              - Sid: InvalidateFrontendCache
                Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/*

  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: fly-ae-v0-prod-monthly
        BudgetLimit:
          Amount: 25
          Unit: USD
        BudgetType: COST
        TimeUnit: MONTHLY
      NotificationsWithSubscribers:
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: ACTUAL
            Threshold: 10
            ThresholdType: ABSOLUTE_VALUE
          Subscribers:
            - Address: !Ref BudgetEmail
              SubscriptionType: EMAIL
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: ACTUAL
            Threshold: 25
            ThresholdType: ABSOLUTE_VALUE
          Subscribers:
            - Address: !Ref BudgetEmail
              SubscriptionType: EMAIL

Outputs:
  FrontendCertificateArn:
    Value: !Ref FrontendCertificate
  GitHubDeployRoleArn:
    Value: !GetAtt GitHubDeployRole.Arn
  CloudFormationExecutionRoleArn:
    Value: !GetAtt CloudFormationExecutionRole.Arn
