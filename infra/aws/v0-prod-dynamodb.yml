AWSTemplateFormatVersion: "2010-09-09"
Description: fly.ae V0 production DynamoDB persistence

Parameters:
  EnvironmentName:
    Type: String
    Default: v0-prod
    AllowedPattern: "[a-z0-9-]+"

Resources:
  FlyAeTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "fly-ae-${EnvironmentName}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttlEpochSeconds
        Enabled: true
      Tags:
        - Key: Application
          Value: fly.ae
        - Key: Environment
          Value: !Ref EnvironmentName

Outputs:
  TableName:
    Value: !Ref FlyAeTable
  TableArn:
    Value: !GetAtt FlyAeTable.Arn
