name: fly-ae

services:
  postgres:
    image: postgres:16.9-alpine
    environment:
      POSTGRES_DB: flyae
      POSTGRES_USER: flyae
      POSTGRES_PASSWORD: flyae
    ports:
      - "55432:5432"
    volumes:
      - flyae-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flyae -d flyae"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: flyae
      MINIO_ROOT_PASSWORD: flyae-local-secret
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3000
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - flyae-minio:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: ["/bin/sh", "/bootstrap-minio.sh"]
    environment:
      MINIO_ROOT_USER: flyae
      MINIO_ROOT_PASSWORD: flyae-local-secret
      FLY_S3_BUCKET: fly-ae-documents
    volumes:
      - ./minio/bootstrap-minio.sh:/bootstrap-minio.sh:ro
    restart: "no"

  backend:
    profiles: ["application"]
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: local
      FLY_DATABASE_URL: jdbc:postgresql://postgres:5432/flyae
      FLY_DATABASE_USER: flyae
      FLY_DATABASE_PASSWORD: flyae
      FLY_S3_ENDPOINT: http://minio:9000
      FLY_S3_REGION: us-east-1
      FLY_S3_BUCKET: fly-ae-documents
      FLY_S3_ACCESS_KEY: flyae
      FLY_S3_SECRET_KEY: flyae-local-secret
      FLY_S3_PATH_STYLE: "true"
      FLY_ALLOWED_ORIGINS: http://localhost:3000
      FLY_PUBLIC_BASE_URL: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

volumes:
  flyae-postgres:
  flyae-minio:
