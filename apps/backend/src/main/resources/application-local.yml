fly:
  security:
    session-secret: ${FLY_SESSION_SECRET:local-session-secret-change-before-production-32}
    otp-pepper: ${FLY_OTP_PEPPER:local-otp-pepper-change-before-production-32}
    share-encryption-secret: ${FLY_SHARE_ENCRYPTION_SECRET:local-share-encryption-change-before-production}
  storage:
    endpoint: ${FLY_S3_ENDPOINT:http://localhost:9000}
    access-key: ${FLY_S3_ACCESS_KEY:flyae}
    secret-key: ${FLY_S3_SECRET_KEY:flyae-local-secret}
    path-style: true

logging:
  level:
    ae.fly.backend: INFO
