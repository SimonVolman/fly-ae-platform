name: Deploy PROD maintenance (fly.ae) on Lambda

on:
  workflow_dispatch:
    inputs:
      enable_custom_domain:
        description: Attach the fly.ae alias and Route53 records
        required: true
        type: boolean
        default: true
      enable_telegram_otp:
        description: Enable Telegram OTP (requires Secrets Manager values)
        required: true
        type: boolean
        default: false
  workflow_call:
    inputs:
      release_mode:
        description: Frontend release to publish (maintenance or application)
        required: false
        type: string
        default: maintenance
      enable_custom_domain:
        description: Attach the fly.ae alias and Route53 records
        required: false
        type: boolean
        default: true
      enable_telegram_otp:
        description: Enable Telegram OTP (requires Secrets Manager values)
        required: false
        type: boolean
        default: false

concurrency:
  group: fly-ae-domain-prod
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Test, build and deploy
    runs-on: ubuntu-latest
    environment: prod
    env:
      AWS_ACCOUNT_ID: "808906610083"
      AWS_REGION: eu-central-1
      AWS_GLOBAL_REGION: us-east-1
      AWS_STACK_NAME: fly-ae-domain-prod
      AWS_BOOTSTRAP_STACK_NAME: fly-ae-domain-bootstrap-global
      AWS_ARTIFACT_BUCKET: fly-ae-domain-sam-artifacts-808906610083-eu-central-1
      AWS_DEPLOY_ROLE_ARN: arn:aws:iam::808906610083:role/fly-ae-domain-prod-github-deploy
      AWS_CLOUDFORMATION_ROLE_ARN: arn:aws:iam::808906610083:role/fly-ae-domain-prod-cloudformation
      RESOURCE_PREFIX: fly-ae-domain-prod
      ENVIRONMENT_NAME: prod
      SECRET_PATH_PREFIX: fly-ae/domain-prod
      FRONTEND_DOMAIN: fly.ae
      HOSTED_ZONE_ID: Z10483352SBZ9U6ULG9OH
      RELEASE_MODE: ${{ inputs.release_mode || 'maintenance' }}
      ENABLE_CUSTOM_DOMAIN: ${{ inputs.enable_custom_domain && 'true' || 'false' }}
      ENABLE_TELEGRAM_OTP: ${{ inputs.enable_telegram_otp && 'true' || 'false' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate release mode
        run: |
          case "$RELEASE_MODE" in
            maintenance|application) ;;
            *)
              echo "Unsupported release mode: $RELEASE_MODE" >&2
              exit 1
              ;;
          esac

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Test and lint frontend
        run: |
          npm run test:web
          npm run lint

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Test and package backend
        run: ./apps/backend/gradlew -p apps/backend --no-daemon test buildLambdaZip

      - name: Set up AWS SAM
        uses: aws-actions/setup-sam@v2

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve bootstrap outputs
        id: bootstrap
        run: |
          certificate_arn="$(aws cloudformation describe-stacks \
            --region "$AWS_GLOBAL_REGION" \
            --stack-name "$AWS_BOOTSTRAP_STACK_NAME" \
            --query 'Stacks[0].Outputs[?OutputKey==`FrontendCertificateArn`].OutputValue' \
            --output text)"
          echo "certificate_arn=$certificate_arn" >> "$GITHUB_OUTPUT"

      - name: Validate SAM template
        run: sam validate --lint --template-file infra/aws/template.yml

      - name: Deploy application stack
        run: |
          sam deploy \
            --region "$AWS_REGION" \
            --stack-name "$AWS_STACK_NAME" \
            --template-file infra/aws/template.yml \
            --s3-bucket "$AWS_ARTIFACT_BUCKET" \
            --s3-prefix "$AWS_STACK_NAME" \
            --role-arn "$AWS_CLOUDFORMATION_ROLE_ARN" \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              ResourcePrefix="$RESOURCE_PREFIX" \
              EnvironmentName="$ENVIRONMENT_NAME" \
              EnableCustomDomain="$ENABLE_CUSTOM_DOMAIN" \
              FrontendDomainName="$FRONTEND_DOMAIN" \
              HostedZoneId="$HOSTED_ZONE_ID" \
              FrontendCertificateArn="${{ steps.bootstrap.outputs.certificate_arn }}" \
              DeploymentRevision="$GITHUB_SHA" \
              SessionSecretParameter="$SECRET_PATH_PREFIX/session-secret" \
              OtpPepperParameter="$SECRET_PATH_PREFIX/otp-pepper" \
              ShareEncryptionSecretParameter="$SECRET_PATH_PREFIX/share-encryption-secret" \
              EnableTelegramOtp="$ENABLE_TELEGRAM_OTP" \
              TelegramBotUsername="FlyAeOtpBot" \
              TelegramBotTokenParameter="$SECRET_PATH_PREFIX/telegram-bot-token" \
              TelegramWebhookSecretParameter="$SECRET_PATH_PREFIX/telegram-webhook-secret" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      - name: Resolve application outputs
        id: application
        run: |
          api_url="$(aws cloudformation describe-stacks \
            --stack-name "$AWS_STACK_NAME" \
            --query 'Stacks[0].Outputs[?OutputKey==`ApiBaseUrl`].OutputValue' \
            --output text)"
          frontend_bucket="$(aws cloudformation describe-stacks \
            --stack-name "$AWS_STACK_NAME" \
            --query 'Stacks[0].Outputs[?OutputKey==`FrontendBucketName`].OutputValue' \
            --output text)"
          distribution_id="$(aws cloudformation describe-stacks \
            --stack-name "$AWS_STACK_NAME" \
            --query 'Stacks[0].Outputs[?OutputKey==`DistributionId`].OutputValue' \
            --output text)"
          distribution_domain="$(aws cloudformation describe-stacks \
            --stack-name "$AWS_STACK_NAME" \
            --query 'Stacks[0].Outputs[?OutputKey==`DistributionDomainName`].OutputValue' \
            --output text)"
          echo "api_url=$api_url" >> "$GITHUB_OUTPUT"
          echo "frontend_bucket=$frontend_bucket" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$distribution_id" >> "$GITHUB_OUTPUT"
          echo "distribution_domain=$distribution_domain" >> "$GITHUB_OUTPUT"

      - name: Build static frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ steps.application.outputs.api_url }}/api/v1
          NEXT_PUBLIC_MAINTENANCE_MODE: ${{ inputs.release_mode == 'application' && 'false' || 'true' }}
        run: npm run build:aws --workspace @fly-ae/web

      - name: Publish static frontend
        run: |
          aws s3 sync apps/web/out "s3://${{ steps.application.outputs.frontend_bucket }}" \
            --delete \
            --only-show-errors
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.application.outputs.distribution_id }}" \
            --paths '/*' >/dev/null

      - name: Smoke test
        env:
          API_URL: ${{ steps.application.outputs.api_url }}
          FRONTEND_URL: ${{ inputs.enable_custom_domain && format('https://{0}', env.FRONTEND_DOMAIN) || format('https://{0}', steps.application.outputs.distribution_domain) }}
        run: |
          for attempt in {1..18}; do
            if curl --fail --silent --show-error "$API_URL/api/v1/categories" >/dev/null && \
               curl --fail --silent --show-error "$FRONTEND_URL" >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "Smoke test did not become healthy in time." >&2
          exit 1

      - name: Smoke test Telegram authentication
        if: ${{ inputs.enable_telegram_otp }}
        env:
          API_URL: ${{ steps.application.outputs.api_url }}
        run: |
          curl --fail --silent --show-error "$API_URL/api/v1/auth/otp/options" \
            | grep --fixed-strings '"telegramEnabled":true' >/dev/null
